name: Build Decktation Plugin

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [master, main]
  delete:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node scripts/release-version.mjs check
      - run: node --test cloudflare/tests/*.test.js
      - run: pip install pytest sentry-sdk==2.66.0
      - run: pytest tests/ -v
      - run: python -m py_compile main.py backend/src/decktation_backend.py backend/src/wow_voice_chat.py backend/src/controller_listener.py backend/src/deck_hid.py backend/src/gamepad_evdev.py backend/src/telemetry.py backend/src/haptic_feedback.py

  build:
    if: github.event_name != 'delete'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-version.mjs check "$RELEASE_TAG"

      - name: Set development version for branch builds
        if: startsWith(github.ref, 'refs/heads/')
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          BASE_VERSION="$(node scripts/release-version.mjs print)"
          DEV_VERSION="$(node scripts/release-version.mjs next-dev "$BASE_VERSION" "$COMMIT_SHA")"
          node scripts/release-version.mjs set "$DEV_VERSION"

      - name: Download Decky CLI
        run: |
          curl -fL -o /tmp/decky-cli \
            https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.7/decky-linux-x86_64
          chmod +x /tmp/decky-cli

      - name: Build marketplace artifact
        run: sudo /tmp/decky-cli plugin build -b -t /tmp/decktation-decky-build -o build-output -s directory .

      - name: Validate artifact
        run: |
          unzip -t build-output/decktation.zip
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/ydotoold'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/xclip'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/clipboard_injection.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/python/faster_whisper'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/python/sentry_sdk'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/lib/libportaudio.so.2'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/telemetry.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/decktation_backend.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/controller_listener.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/haptic_feedback.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/game_presets.json'
          unzip -l build-output/decktation.zip | grep -q 'decktation/channel_languages.json'
          unzip -l build-output/decktation.zip | grep -q 'cpython-311'
          ! unzip -l build-output/decktation.zip | grep -q 'cpython-313'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/bin/python/av/'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/debug_controller.py'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/test.py'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/test_channels.py'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/test_audio.wav'

      - name: Validate custom store catalog
        run: |
          DECKTATION_VERSION="$(node scripts/release-version.mjs print)"
          python scripts/generate-store-catalog.py \
            --artifact build-output/decktation.zip \
            --artifact-url "https://silverfoxy.github.io/decktation/releases/v${DECKTATION_VERSION}/decktation.zip" \
            --output /tmp/decktation-store.json
          python -m json.tool /tmp/decktation-store.json >/dev/null

      - name: Upload CI build as a direct file
        id: plugin-artifact
        uses: actions/upload-artifact@v7
        with:
          path: build-output/decktation.zip
          archive: false

      - name: Add test download links to the workflow summary
        env:
          ARTIFACT_URL: ${{ steps.plugin-artifact.outputs.artifact-url }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          {
            echo "## Decktation test build"
            echo "- Ref: \`$REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- [Download the ready-to-install plugin ZIP]($ARTIFACT_URL) from this Actions run. GitHub sign-in is required."
            if [ "$EVENT_NAME" != "pull_request" ] && [ "$REF_TYPE" = "branch" ]; then
              BRANCH_PATH="$(python3 scripts/branch-slug.py "$REF_NAME")"
              echo "- Public branch URL (when GitHub Pages is enabled): [$PAGES_BASE_URL/branches/$BRANCH_PATH/decktation.zip]($PAGES_BASE_URL/branches/$BRANCH_PATH/decktation.zip)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish Pages downloads
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-pages.sh

      - name: Upload release archive
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/decktation.zip
          body: |
            ## Installation

            Download **decktation.zip** from the Assets section and import it
            with Decky's **Install Plugin from ZIP** option.

            **Do not download “Source code (zip)” or “Source code (tar.gz)”.**
            GitHub adds those archives automatically, but they do not contain
            Decktation's bundled Python dependencies and will not run.
          draft: false
          prerelease: false
          generate_release_notes: true

  cleanup-pages:
    if: github.event_name == 'delete'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prune deleted branch downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          CLEANUP_ONLY: "true"
        run: bash scripts/publish-pages.sh

  deploy-pages:
    # Publishing gh-pages with GITHUB_TOKEN does not itself trigger a Pages deployment.
    needs: [build, cleanup-pages]
    if: >-
      ${{
        !cancelled() &&
        github.event_name != 'pull_request' &&
        (needs.build.result == 'success' || needs.cleanup-pages.result == 'success')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # GitHub's default Pages environment may be limited to protected branches.
    # This dedicated environment lets every branch in this fork publish previews.
    environment:
      name: decktation-previews
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout generated download site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages-site
          persist-credentials: false

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-site
          include-hidden-files: true

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
