name: Build Decktation Plugin

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [master, main]
    paths-ignore:
      - 'site/**'
      - 'cloudflare/**'
      - '.github/workflows/website.yml'
      - 'doc/CLOUDFLARE_WORKER.md'
      - 'doc/DOMAIN_SETUP.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: pytest tests/test_private_runtime.py -v

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node scripts/release-version.mjs check
      - run: node --test cloudflare/tests/*.test.js
      - run: sudo apt-get update -qq && sudo apt-get install -y libwayland-dev libwayland-bin
      - run: pip install pytest sentry-sdk==2.66.0 certifi==2026.1.4
      - run: pytest tests/ -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts
      - run: npm run test:update
      - run: python -m py_compile main.py backend/src/decktation_backend.py backend/src/plugin_update.py backend/src/wow_voice_chat.py backend/src/controller_listener.py backend/src/deck_hid.py backend/src/gamepad_evdev.py backend/src/telemetry.py backend/src/haptic_feedback.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-version.mjs check "$RELEASE_TAG"

      - name: Set development version for branch builds
        if: startsWith(github.ref, 'refs/heads/')
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          BASE_VERSION="$(node scripts/release-version.mjs print)"
          DEV_VERSION="$(node scripts/release-version.mjs next-dev "$BASE_VERSION" "$COMMIT_SHA" "$BRANCH_NAME")"
          node scripts/release-version.mjs set "$DEV_VERSION"

      - name: Set development version for PR builds
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BASE_VERSION="$(node scripts/release-version.mjs print)"
          DEV_VERSION="$(node scripts/release-version.mjs next-dev "$BASE_VERSION" "$HEAD_SHA" "pr-$PR_NUMBER")"
          node scripts/release-version.mjs set "$DEV_VERSION"

      - name: Download Decky CLI
        run: |
          curl -fL -o /tmp/decky-cli \
            https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.7/decky-linux-x86_64
          chmod +x /tmp/decky-cli

      - name: Build marketplace artifact
        run: sudo /tmp/decky-cli plugin build -b -t /tmp/decktation-decky-build -o build-output -s directory .

      - name: Validate artifact
        run: |
          unzip -t build-output/decktation.zip
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/ydotoold'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/gamescope-inject'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/licenses/gamescope-input-method-MIT.xml'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/whisper-server'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/bin/whisper-cli'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/resident_whisper.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/xclip'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/clipboard_injection.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/python/sentry_sdk'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/python/numpy'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/lib/libportaudio.so.2'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/telemetry.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/decktation_backend.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/plugin_update.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/controller_listener.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/haptic_feedback.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/game_presets.json'
          unzip -l build-output/decktation.zip | grep -q 'decktation/channel_languages.json'
          unzip -l build-output/decktation.zip | grep -q 'cpython-311'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/runtime/bin/python3.11'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/runtime_worker.py'
          unzip -l build-output/decktation.zip | grep -q 'decktation/bin/runtime_proxy.py'
          ! unzip -l build-output/decktation.zip | grep -q 'cpython-313'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/bin/python/av/'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/bin/python/ctranslate2'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/bin/python/faster_whisper'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/bin/python/onnxruntime'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/test.py'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/test_channels.py'
          ! unzip -l build-output/decktation.zip | grep -q 'decktation/test_audio.wav'

      - name: Validate custom store catalog
        run: |
          DECKTATION_VERSION="$(node scripts/release-version.mjs print)"
          python scripts/generate-store-catalog.py \
            --artifact build-output/decktation.zip \
            --artifact-url "https://decktation.com/releases/v${DECKTATION_VERSION}/Decktation.zip" \
            --output /tmp/decktation-store.json
          python -m json.tool /tmp/decktation-store.json >/dev/null

      - name: Upload CI build as a direct file
        id: plugin-artifact
        uses: actions/upload-artifact@v7
        with:
          name: decktation.zip
          path: build-output/decktation.zip
          archive: false

      - name: Add test download links to the workflow summary
        env:
          ARTIFACT_URL: ${{ steps.plugin-artifact.outputs.artifact-url }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
          PAGES_BASE_URL: ${{ vars.DECKTATION_PAGES_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          {
            echo "## Decktation test build"
            echo "- Ref: \`$REF_NAME\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- [Download the ready-to-install plugin ZIP]($ARTIFACT_URL) from this Actions run. GitHub sign-in is required."
            if [ "$EVENT_NAME" != "pull_request" ] && [ "$REF_TYPE" = "branch" ]; then
              BRANCH_PATH="$(python3 scripts/branch-slug.py "$REF_NAME")"
              echo "- Public branch URL (when GitHub Pages is enabled): [$PAGES_BASE_URL/branches/$BRANCH_PATH/Decktation.zip]($PAGES_BASE_URL/branches/$BRANCH_PATH/Decktation.zip)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
